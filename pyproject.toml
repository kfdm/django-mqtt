[project]
name = "django-mqtt"
version = "0.9.0"
description = "Django MQTT integration"
readme = "README.md"
# https://endoflife.date/python
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Paul Traylor" }]
keywords = [
    "django",
    "mqtt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# https://endoflife.date/django
dependencies = [
    "Django>=5.2",
    "paho-mqtt",
]

[project.urls]
Issues = "http://github.com/kfdm/django-mqtt/issues"
"Source Code" = "http://github.com/kfdm/django-mqtt"

[dependency-groups]
dev = [
    "repo-review-classifiers>=0.1.0",
    "repo-review-endoflife>=0.3.0",
    "repo-review-just>=0.2.0",
    "repo-review-readme>=0.1.1",
    "repo-review[cli]>=1.2.2",
    "validate-pyproject>=0.27",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]  # https://beta.ruff.rs/docs/rules/
select = [
    "C",        # Complexity
    "E",        # pycodestyle
    "F",        # Unused imports
    "I",        # isort
    "DJ",       # Django
    "PGH004",   # Use specific rule codes when using noqa
    "PLC0414",  # Useless import alias. Import alias does not rename original package.
    "S103",     # bad-file-permissions
    "TRY004",   # Prefer TypeError exception for invalid type
    "UP",       # pyupgrade
    "W",        # pycodestyle
]
ignore = [
    "E501",     # Don't enforce line length for now
    "E741",     # Ambiguous variable name
]

[tool.setuptools.packages.find]
exclude = ["test"]

[tool.tombi.format.rules]
indent-width = 4
trailing-comment-alignment = true

[tool.ty.analysis]
# Suppress errors for all `test` modules except `test.foo`
allowed-unresolved-imports = ["setproctitle", "rest_framework.utils.encoders"]

[tool.uv.build-backend]
module-name = "dmqtt"
